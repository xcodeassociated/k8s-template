# k3s cluster VMs — Proxmox guests, passwordless SSH as worker
# (hostnames resolve via /etc/hosts or LAN DNS)

[kube_master]
kube-0.lan

[kube_workers]
kube-1.lan
kube-2.lan
kube-3.lan

[kube_nodes:children]
kube_master
kube_workers

[all:vars]
ansible_user=worker
ansible_python_interpreter=/usr/bin/python3
# Proxmox host running the kube VMs (API on :8006). Token/secret go in
# ansible/group_vars/all/pve.yml (gitignored) — see pve.yml.template.
pve_host=p0b.lan
