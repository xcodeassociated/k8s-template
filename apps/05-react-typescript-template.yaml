apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-typescript-template
  labels:
    app: react-typescript-template
spec:
  # Stateless static asset server (tokens live in the browser; SSE/WS
  # connections terminate on the backends, not here) — replicas are freely
  # scalable with no stickiness or fan-out requirements.
  replicas: 2
  selector:
    matchLabels:
      app: react-typescript-template
  template:
    metadata:
      labels:
        app: react-typescript-template
      annotations:
        linkerd.io/inject: "enabled"
    spec:
      containers:
        - name: react-typescript-template
          image: xcodeassociated/react-typescript-vite-plus-template:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: react-typescript-template
  labels:
    app: react-typescript-template
spec:
  selector:
    app: react-typescript-template
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP

# ─── Middleware + HTTPRoute (Gateway API) ────────────────────────────────────
# proxy-body-size: 10m -> buffering middleware (rejects bodies > 10 MB);
# force-ssl-redirect is global in the Traefik install (web -> websecure).
# TLS: `app`/`app-www` listeners on the `edge` Gateway
# (dependencies/06-gateway.yaml), secret app-certificate-prod.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: react-typescript-body-limit
  labels:
    app: react-typescript-template
spec:
  buffering:
    maxRequestBodyBytes: 10485760   # 10 MB

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: react-typescript-template
  labels:
    app: react-typescript-template
spec:
  parentRefs:
    - name: edge
  hostnames:
    - "app.softeno.dev"
    - "www.app.softeno.dev"
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: react-typescript-body-limit
      backendRefs:
        - name: react-typescript-template
          port: 80

### add hosts to /etc/hosts for local testing:
# sudo sh -c 'echo "127.0.0.1 app.softeno.dev" >> /etc/hosts'
# sudo sh -c 'echo "127.0.0.1 www.app.softeno.dev" >> /etc/hosts'
