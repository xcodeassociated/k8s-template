apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-reactive-mongo-config
  labels:
    app: spring-reactive-mongo
data:
  SERVER_FORWARD_HEADERS_STRATEGY: "framework"

  # ── MongoDB (Community Operator replica set) ───────────────────────────────
  # The operator creates the service: mongodb-rs-svc.mongo.svc.cluster.local
  MONGO_HOST: "mongodb-rs-svc.mongo.svc.cluster.local"
  MONGO_PORT: "27017"
  MONGO_USER: "user"
  MONGO_DB: "admin" # todo: change!
  MONGO_RS: "mongodb-rs"

  # ── Kafka (Strimzi kafka-cluster) ─────────────────────────────────────────
  KAFKA_URL: "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
  KAFKA_GROUP: "sample-group-jvm"
  KAFKA_TOPIC_TX: "sample_topic_2"
  KAFKA_TOPIC_RX: "sample_topic_2"
  KAFKA_KEYCLOAK: "keycloak-events"
  # required: com.softeno.kafka.keycloak-admin=${KAFKA_KEYCLOAK_ADMIN}
  KAFKA_KEYCLOAK_ADMIN: "keycloak-admin-events"

  # ── WebSocket (/ws + one-time-ticket handshake) ────────────────────────────
  # Explicit enablement; allowed-origins must list the exact origins the
  # frontend/dev-chat pages are served from, or the handshake and ticket
  # redemption are rejected (CSWSH protection). The HTTPRoute + TraefikService
  # below handle WebSocket upgrades, streaming, and cookie-sticky sessions.
  COM_SOFTENO_WS_ENABLED: "true"
  COM_SOFTENO_WS_ALLOWED_ORIGINS: "https://app.softeno.dev,https://api.softeno.dev"
  COM_SOFTENO_TICKET_ALLOWED_ORIGINS: "https://app.softeno.dev,https://api.softeno.dev"

  # ── Keycloak / OAuth2 ──────────────────────────────────────────────────────
  OAUTH_CLIENT_ID: "backend"
  OAUTH_GRANT_TYPE: "client_credentials"
  OAUTH_ISSUER_URI: "https://auth.softeno.dev/realms/app"
  OAUTH_JWK_SET_URI: "https://auth.softeno.dev/realms/app/protocol/openid-connect/certs"
  OAUTH_AUTHORIZATION_URI: "https://auth.softeno.dev/realms/app/protocol/openid-connect/auth"
  OAUTH_TOKEN_URI: "https://auth.softeno.dev/realms/app/protocol/openid-connect/token"
  OAUTH_USER_INFO_URI: "https://auth.softeno.dev/realms/app/protocol/openid-connect/userinfo"

  # ── Inter-service calls (both apps run in the same namespace: default) ─────
  EXTERNAL_URL: "http://spring-reactive-r2dbc:8082/sample-secured"
  EXTERNAL_NAME: "spring-reactive-r2dbc-template"
  # r2dbc serves no GraphQL endpoint — the sample external-GraphQL client
  # targets this app's own /graphql (same as the compose localhost pattern)
  EXTERNAL_GRAPH_QL: "http://spring-reactive-mongo:8080/graphql"
  SPRING_GRPC_CLIENT_CHANNELS_EXTERNAL_ADDRESS: "spring-reactive-r2dbc:9082"

  # ── Observability (Grafana otel-lgtm in grafana namespace) ─────────────────
  MANAGEMENT_OTLP_METRICS_EXPORT_URL: "http://grafana.grafana.svc.cluster.local:4318/v1/metrics"
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: "http://grafana.grafana.svc.cluster.local:4318/v1/traces"
  MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: "http://grafana.grafana.svc.cluster.local:4318/v1/logs"

---
# ─── Deployment ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-reactive-mongo
  labels:
    app: spring-reactive-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spring-reactive-mongo
  template:
    metadata:
      labels:
        app: spring-reactive-mongo
      annotations:
        linkerd.io/inject: "enabled"
    spec:
      containers:
        - name: spring-reactive-mongo
          image: xcodeassociated/spring-reactive-template:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9080
          envFrom:
            - configMapRef:
                name: spring-reactive-mongo-config
            - secretRef:
                name: spring-reactive-mongo-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"

---
# ─── Service ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: spring-reactive-mongo
  labels:
    app: spring-reactive-mongo
spec:
  selector:
    app: spring-reactive-mongo
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 9080
      targetPort: 9080
      # GRPCRoute backend protocol hint — Traefik accepts kubernetes.io/h2c
      # (or https) here; kubernetes.io/grpc is rejected with UnsupportedProtocol
      appProtocol: kubernetes.io/h2c
  type: ClusterIP

---
# ─── TraefikService (cookie stickiness for WebSocket reconnects) ──────────────
# Sticky sessions are not expressible in the Gateway API HTTPRoute spec yet
# (traefik/traefik#11243; Gateway WG GEP-4894 in progress), so the route points
# at this TraefikService wrapper instead of the plain Service. Equivalent of
# the old nginx affinity: cookie / session-cookie-name: ws-route annotations.
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: spring-reactive-mongo-sticky
  labels:
    app: spring-reactive-mongo
spec:
  weighted:
    services:
      - name: spring-reactive-mongo
        port: 8080
        weight: 1
        sticky:
          cookie:
            name: ws-route
            secure: true

---
# ─── HTTPRoute (HTTP + WebSocket + gRPC) ───────────────────────────────────
# Replaces the nginx Ingress:
#   rewrite-target /spring-reactive-template(/|$)(.*) -> /$2
#     -> PathPrefix match + URLRewrite ReplacePrefixMatch "/"
#   x-forwarded-prefix -> RequestHeaderModifier set X-Forwarded-Prefix
# WebSocket Upgrade and SSE stream through Traefik with no extra config
# (no response buffering/timeouts by default).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spring-reactive-mongo
  labels:
    app: spring-reactive-mongo
spec:
  parentRefs:
    - name: edge
  hostnames:
    - "api.softeno.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /spring-reactive-template
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Prefix
                value: /spring-reactive-template
      backendRefs:
        - group: traefik.io
          kind: TraefikService
          name: spring-reactive-mongo-sticky
    # gRPC (replaces the nginx backend-protocol: GRPC Ingress): a second rule
    # on the SAME route. A separate GRPCRoute on the same hostname fails with
    # HostnameConflict in Traefik v3.7; the h2c backend protocol comes from
    # appProtocol on the Service port (HTTPRouteBackendProtocolH2C, core
    # conformance). Client-side TLS/h2 is served by the `api` listener.
    - matches:
        - path:
            type: PathPrefix
            value: /com.softeno.template.grpc.SampleGrpcService
      backendRefs:
        - name: spring-reactive-mongo
          port: 9080

### example gRPC unary call:
# GRPC https://api.softeno.dev/com.softeno.template.grpc.SampleGrpcService/Echo
# { "data": "123" }

### add host to /etc/hosts:
# sudo sh -c 'echo "127.0.0.1 api.softeno.dev" >> /etc/hosts'
