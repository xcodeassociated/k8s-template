# ─── User password secret ─────────────────────────────────────────────────────
# IMPORTANT: Replace password before deploying.
# This MUST match MONGO_PASSWORD in spring-reactive-mongo-secret.
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-admin-password
  namespace: mongo
type: Opaque
stringData:
  password: xxx   # sync with spring-reactive-mongo-secret (MONGO_PASSWORD)

---

# ─── Secrets ──────────────────────────────────────────────────────────────────
# IMPORTANT: Replace ALL passwords before deploying.
# Generate strong passwords: openssl rand -base64 32
#
# These passwords MUST also be set in the corresponding application Secrets:
#   postgres-app-credentials.password      → spring-reactive-r2dbc Secret
#   postgres-keycloak-credentials.password → keycloak Secret (KC_DB_PASSWORD)

apiVersion: v1
kind: Secret
metadata:
  name: postgres-app-credentials
  namespace: postgres
type: kubernetes.io/basic-auth
stringData:
  username: xxx
  password: xxx   # sync with spring-reactive-r2dbc-secret

---

apiVersion: v1
kind: Secret
metadata:
  name: postgres-keycloak-credentials
  namespace: postgres
type: kubernetes.io/basic-auth
stringData:
  username: keycloak
  password: xxx   # sync with secret-keycloak (KC_DB_PASSWORD)

---

# ─── Secret ───────────────────────────────────────────────────────────────────
# IMPORTANT: KC_DB_PASSWORD must match postgres-keycloak-credentials.password
#            in postgres.yaml (CHANGE_ME_STRONG_PASSWORD_2).
#
# Generate base64: echo -n 'your-password' | base64
apiVersion: v1
kind: Secret
metadata:
  name: secret-keycloak
type: Opaque
stringData:
  KEYCLOAK_ADMIN: "xxx"            # "admin" — change for production
  KEYCLOAK_ADMIN_PASSWORD: "xxx"   # "admin" — change for production
  KC_DB_USERNAME: "keycloak"       # "keycloak" — must match postgres-keycloak-credentials.username
  KC_DB_PASSWORD: "xxx"    # set to base64 of CHANGE_ME_STRONG_PASSWORD_2

---

# ─── Secret ───────────────────────────────────────────────────────────────────
# IMPORTANT: SPRING_R2DBC_PASSWORD and SPRING_LIQUIBASE_PASSWORD MUST match
#            postgres-app-credentials.password in postgres.yaml
#            (CHANGE_ME_STRONG_PASSWORD_1).
apiVersion: v1
kind: Secret
metadata:
  name: spring-reactive-r2dbc-secret
  labels:
    app: spring-reactive-r2dbc
type: Opaque
stringData:
  SPRING_R2DBC_PASSWORD: "xxx"       # must match postgres-app-credentials
  SPRING_LIQUIBASE_PASSWORD: "xxx"   # must match postgres-app-credentials
  SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET: "xxx"

---
# ─── Secret ───────────────────────────────────────────────────────────────────
# IMPORTANT: MONGO_PASSWORD MUST match mongodb-admin-password.password
#            in mongo.yaml (CHANGE_ME_STRONG_PASSWORD).
apiVersion: v1
kind: Secret
metadata:
  name: spring-reactive-mongo-secret
  labels:
    app: spring-reactive-mongo
type: Opaque
stringData:
  MONGO_PASSWORD: "xxx"   # must match mongodb-admin-password in mongo.yaml
  OAUTH_CLIENT_SECRET: "xxx"
