---
# Upgrade the cluster components: Rancher, Longhorn, k3s, Linkerd.
# UNIVERSAL — you NEVER provide version numbers. Everything is discovered:
#   - Rancher/Longhorn: installed version from `helm list`, available versions
#     from `helm search repo --versions` (officially documented discovery);
#     the stepwise latest-patch-per-minor path is computed by
#     ansible/files/stepwise-path.py (both vendors require one-minor hops;
#     Longhorn's pre-upgrade job hard-blocks skipping).
#   - k3s: the system-upgrade-controller plans track the stable CHANNEL URL and
#     resolve + apply new versions themselves — no version string exists here.
#   - Linkerd: install script always fetches the newest CLI; `linkerd upgrade`
#     targets the CLI version and retains cluster config/TLS.
# Optional overrides (leave empty for fully automatic):
#   -e rancher_max_minor=2.14     stop the Rancher path at a minor
#   -e k3s_version=v1.37.3+k3s1   pin the plans instead of following the channel
#
# Order per official docs:
#   1. Rancher FIRST — SUSE upgrade checklist: "Rancher, Kubernetes, then OS".
#   2. Longhorn next (before any k3s version bump); engines live-upgraded per step.
#   3. k3s via the plans (server -> agent, cordon, concurrency 1); the playbook
#      just waits for convergence.
#   4. Linkerd last (orthogonal). Channel follows the cluster (edge->edge,
#      stable->stable); viz is re-installed with the customized
#      `-enforced-host` regex re-applied by sed (extensions have no `upgrade`).
#
#   ansible-playbook -i ansible/inventory.ini ansible/update-cluster.yml
#   dry run (version report only, no changes):  --tags report
#   single component:                           --tags rancher|longhorn|k3s|linkerd
#
# All steps run ON THE MASTER (helm/kubectl/linkerd CLI live there). Nothing is
# destroyed; worst case per component is a helm rollback to the previous
# release (revision recorded in the output). Pre-step: Keycloak backup.
# Before a real run also take a k3s snapshot: sudo k3s etcd-snapshot save.

- name: Pre-flight — backup + current versions
  hosts: kube_master
  gather_facts: false
  tags: [report, always]
  vars:
    repo_dir: /home/worker/k8s-template
  tasks:
    - name: Keycloak backup (realm JSON + DB dumps)
      ansible.builtin.command: bash {{ repo_dir }}/scripts/backup-keycloak.sh
      when: skip_backup | default(false) | bool == false
      register: kc_backup
      changed_when: true
      failed_when: false
      tags: [backup]

    - name: Collect current versions
      ansible.builtin.shell: |
        echo "rancher=$(kubectl -n cattle-system get deploy rancher -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null)"
        echo "longhorn=$(kubectl -n longhorn-system get deploy longhorn-driver-deployer -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null)"
        echo "linkerd=$(kubectl -n linkerd get deploy linkerd-destination -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null)"
        echo "k3s=$(kubectl get nodes -o jsonpath='{.items[0].status.nodeInfo.kubeletVersion}' 2>/dev/null)"
        echo "k3s_plan_target=$(kubectl -n system-upgrade get plan server-plan -o jsonpath='{.status.latestVersion}' 2>/dev/null)"
      register: ver_before
      changed_when: false
      check_mode: false

    - name: Report current versions
      ansible.builtin.debug:
        msg: "{{ ver_before.stdout_lines }}"

- name: Upgrade Rancher (auto-discovered stepwise path, latest patch per minor)
  hosts: kube_master
  gather_facts: false
  tags: [rancher]
  vars:
    rancher_repo: rancher-stable/rancher
    rancher_max_minor: ""   # optional: stop the path at this minor, e.g. "2.14"
  tasks:
    - name: Ensure helm repos are present
      ansible.builtin.command: "helm repo add {{ item.0 }} {{ item.1 }}"
      loop: [["rancher-stable", "https://releases.rancher.com/server-charts/stable"], ["longhorn", "https://charts.longhorn.io"]]
      loop_control: { label: "{{ item.0 }}" }
      changed_when: false

    - name: Update helm repos
      ansible.builtin.command: helm repo update
      changed_when: true

    - name: Ship stepwise path helper
      ansible.builtin.copy:
        src: files/stepwise-path.py
        dest: /tmp/stepwise-path.py
        mode: "0755"

    - name: Detect installed Rancher chart version
      ansible.builtin.shell: >-
        helm list -n cattle-system --filter '^rancher$' -o json |
        python3 -c "import sys,json;print(json.load(sys.stdin)[0]['app_version'].lstrip('v'))"
      register: rancher_installed
      changed_when: false
      check_mode: false

    - name: Compute Rancher upgrade path
      ansible.builtin.shell: |
        set -e
        helm search repo {{ rancher_repo }} --versions -o json > /tmp/rancher-repo.json
        CUR="{{ rancher_installed.stdout }}" MAX="{{ rancher_max_minor }}" python3 /tmp/stepwise-path.py /tmp/rancher-repo.json
      register: rancher_path
      changed_when: false
      check_mode: false

    - name: Report Rancher path
      ansible.builtin.debug:
        msg: "installed={{ rancher_installed.stdout }} steps={{ rancher_path.stdout_lines }}"

    - name: Step through versions
      ansible.builtin.include_tasks: tasks/upgrade-rancher-step.yml
      loop: "{{ rancher_path.stdout_lines }}"
      loop_control: { loop_var: step, label: "{{ step }}" }

- name: Upgrade Longhorn (auto-discovered stepwise path + engine live-upgrade)
  hosts: kube_master
  gather_facts: false
  tags: [longhorn]
  vars:
    longhorn_live_upgrade: true   # patch volume engines after each step (false = do it via UI)
  tasks:
    - name: Ensure longhorn helm repo is present
      ansible.builtin.command: helm repo add longhorn https://charts.longhorn.io
      changed_when: false

    - name: Update helm repos
      ansible.builtin.command: helm repo update
      changed_when: true

    - name: Ship stepwise path helper
      ansible.builtin.copy:
        src: files/stepwise-path.py
        dest: /tmp/stepwise-path.py
        mode: "0755"

    - name: Preflight — no faulted/unhealthy Longhorn volumes
      ansible.builtin.shell: |
        kubectl -n longhorn-system get volumes -o jsonpath='{range .items[*]}{.status.robustness}{"\n"}{end}' | grep -vc healthy || true
      register: lh_bad
      failed_when: (lh_bad.stdout | int) > 0
      changed_when: false

    - name: Detect installed Longhorn version
      ansible.builtin.shell: >-
        helm list -n longhorn-system --filter '^longhorn$' -o json |
        python3 -c "import sys,json;print(json.load(sys.stdin)[0]['app_version'].lstrip('v'))"
      register: lh_installed
      changed_when: false
      check_mode: false

    - name: Compute Longhorn upgrade path
      ansible.builtin.shell: |
        set -e
        helm search repo longhorn --versions -o json > /tmp/longhorn-repo.json
        CUR="{{ lh_installed.stdout }}" python3 /tmp/stepwise-path.py /tmp/longhorn-repo.json
      register: lh_path
      changed_when: false
      check_mode: false

    - name: Report Longhorn path
      ansible.builtin.debug:
        msg: "installed={{ lh_installed.stdout }} steps={{ lh_path.stdout_lines }}"

    - name: Step through versions
      ansible.builtin.include_tasks: tasks/upgrade-longhorn-step.yml
      loop: "{{ lh_path.stdout_lines }}"
      loop_control: { loop_var: step, label: "{{ step }}" }

- name: "Upgrade k3s (system-upgrade-controller plans: server then agents)"
  hosts: kube_master
  gather_facts: false
  tags: [k3s]
  vars:
    k3s_version: ""   # optional pin, e.g. "v1.37.3+k3s1"; empty = follow the stable channel
  tasks:
    - name: Ensure upgrade plans exist
      ansible.builtin.command: kubectl -n system-upgrade get plan {{ item }}
      loop: [server-plan, agent-plan]
      changed_when: false
      failed_when: false
      register: k3s_plans
      check_mode: false

    - name: Fail if plans are missing
      ansible.builtin.assert:
        that: k3s_plans.results | selectattr('rc', 'ne', 0) | list | length == 0
        fail_msg: "system-upgrade plans missing on master — apply dev-infra k3s/upgrade.yaml first"

    - name: Pin plans to k3s_version (server first)
      ansible.builtin.shell: |
        kubectl -n system-upgrade patch plan {{ item }} --type merge -p '{"spec":{"version":"{{ k3s_version }}","channel":""}}'
      loop: [server-plan, agent-plan]
      when: k3s_version | length > 0
      register: k3s_pin
      changed_when: "'patched' in k3s_pin.stdout | default('')"

    - name: Report plan targets
      ansible.builtin.shell: |
        kubectl -n system-upgrade get plans -o jsonpath='{range .items[*]}{.metadata.name} target={.status.latestVersion}{"\n"}{end}'
      register: k3s_targets
      changed_when: false
      check_mode: false

    - name: Wait until all nodes run one identical k3s version
      ansible.builtin.shell: |
        kubectl get nodes -o jsonpath='{range .items[*]}{.status.nodeInfo.kubeletVersion}{"\n"}{end}' | sort -u | tr '\n' ' '
      register: k3s_versions
      until: >-
        (k3s_versions.stdout.split() | unique | length) == 1 and
        (k3s_version | default('', true) | length == 0 or k3s_versions.stdout.split()[0] == k3s_version)
      retries: 60
      delay: 15
      changed_when: false
      check_mode: false

    - name: Wait for all nodes Ready
      ansible.builtin.shell: kubectl get nodes --no-headers | grep -c ' Ready'
      register: nodes_ready
      until: (nodes_ready.stdout | int) >= (groups.kube_nodes | length)
      retries: 20
      delay: 10
      changed_when: false
      check_mode: false

- name: "Upgrade Linkerd (channel-aware: edge->edge, stable->stable)"
  hosts: kube_master
  gather_facts: false
  tags: [linkerd]
  vars:
    linkerd_restart_meshed: true   # rollout restart injected deployments (brief pod churn)
  tasks:
    - name: Detect installed channel from the running control plane
      ansible.builtin.set_fact:
        linkerd_channel: "{{ 'edge' if 'edge-' in (ver_before.stdout | regex_search('linkerd=[^\\s]+') or '') else 'stable' }}"

    - name: Install/refresh matching CLI on master
      ansible.builtin.shell: |
        set -e
        mkdir -p $HOME/.local/bin
        if [ "{{ linkerd_channel }}" = "edge" ]; then
          VER=$(curl -sSfL -m 10 https://versioncheck.linkerd.io/version.json | python3 -c "import sys,json;print(json.load(sys.stdin)['edge'])")
        else
          VER=$(curl -sSfL -m 10 https://api.github.com/repos/linkerd/linkerd2/releases/latest | python3 -c "import sys,json;print(json.load(sys.stdin)['tag_name'])")
        fi
        curl -sSfL -m 120 -o $HOME/.local/bin/linkerd "https://github.com/linkerd/linkerd2/releases/download/$VER/linkerd2-cli-$VER-linux-amd64"
        chmod +x $HOME/.local/bin/linkerd
        $HOME/.local/bin/linkerd version --client
      register: linkerd_cli
      changed_when: true

    - name: Set linkerd binary path
      ansible.builtin.set_fact:
        lkd: "/home/{{ ansible_user | default('worker') }}/.local/bin/linkerd"

    - name: Pre-upgrade check
      ansible.builtin.shell: "timeout 120 {{ lkd }} check 2>&1 | grep -E '^×|^‼' || echo clean"
      environment: { PATH: "/usr/local/bin:/usr/bin:/bin:/home/{{ ansible_user | default('worker') }}/.local/bin" }
      changed_when: false
      failed_when: false
      register: linkerd_precheck

    - name: Note pre-check findings (expired anchors in stale pod specs are fixed by this upgrade)
      ansible.builtin.debug:
        msg: "{{ linkerd_precheck.stdout_lines | select('search', '×|‼') | list | default([]) }}"

    - name: Export live identity material (install-config issuer can be stale after cert rotation)
      ansible.builtin.shell: |
        set -e
        kubectl -n linkerd get secret linkerd-identity-issuer -o json | python3 -c "
        import sys, json, base64
        d = json.load(sys.stdin)['data']
        open('/tmp/id-crt.pem','w').write(base64.b64decode(d['crt.pem']).decode())
        open('/tmp/id-key.pem','w').write(base64.b64decode(d['key.pem']).decode())"
        kubectl -n linkerd get cm linkerd-identity-trust-roots -o json | python3 -c "
        import sys, json
        open('/tmp/id-ca.pem','w').write(json.load(sys.stdin)['data']['ca-bundle.crt'])"
      changed_when: false

    - name: Upgrade CRDs + control plane (retains cluster config/TLS, uses live certs)
      ansible.builtin.shell: |
        {{ lkd }} upgrade --crds | kubectl apply -f -
        {{ lkd }} upgrade \
          --identity-issuer-certificate-file /tmp/id-crt.pem \
          --identity-issuer-key-file /tmp/id-key.pem \
          --identity-trust-anchors-file /tmp/id-ca.pem | kubectl apply -f -
      environment: { PATH: "/usr/local/bin:/usr/bin:/bin:/home/{{ ansible_user | default('worker') }}/.local/bin" }
      changed_when: true

    - name: Wait for linkerd control plane
      ansible.builtin.command: "kubectl -n linkerd rollout status deploy/{{ item }} --timeout=180s"
      loop: [linkerd-destination, linkerd-identity, linkerd-proxy-injector]
      changed_when: false

    - name: Re-install viz keeping the customized -enforced-host
      ansible.builtin.shell: |
        {{ lkd }} viz install | sed 's/- -enforced-host=.*$/- -enforced-host=.*$/' | kubectl apply -f -
      environment: { PATH: "/usr/local/bin:/usr/bin:/bin:/home/{{ ansible_user | default('worker') }}/.local/bin" }
      changed_when: true

    - name: Prune leftovers
      ansible.builtin.shell: "{{ lkd }} prune | kubectl delete --ignore-not-found -f - || true"
      environment: { PATH: "/usr/local/bin:/usr/bin:/bin:/home/{{ ansible_user | default('worker') }}/.local/bin" }
      changed_when: true

    - name: Restart meshed deployments one at a time (surge-safe on small clusters)
      ansible.builtin.shell: |
        for d in $(kubectl -n default get deploy -o name); do
          kubectl -n default rollout restart $d >/dev/null
          kubectl -n default rollout status $d --timeout=180s >/dev/null || {
            # capacity deadlock: fall back to recreate-style rollout on this one
            kubectl -n default patch $d --type merge -p '{"spec":{"strategy":{"rollingUpdate":{"maxSurge":0,"maxUnavailable":1}}}}' >/dev/null
            kubectl -n default rollout status $d --timeout=180s
            kubectl -n default patch $d --type merge -p '{"spec":{"strategy":{"rollingUpdate":{"maxSurge":"25%","maxUnavailable":"25%"}}}}' >/dev/null
          }
          echo "ok $d"
        done
      when: linkerd_restart_meshed | bool
      changed_when: true

    - name: Post-upgrade check
      ansible.builtin.shell: "timeout 300 {{ lkd }} check --proxy 2>&1 | grep -E '^×|^‼' || echo clean"
      environment: { PATH: "/usr/local/bin:/usr/bin:/bin:/home/{{ ansible_user | default('worker') }}/.local/bin" }
      changed_when: false
      failed_when: false
      register: linkerd_postcheck

    - name: Report post-check findings
      ansible.builtin.debug:
        msg: "{{ linkerd_postcheck.stdout_lines }}"

- name: "Upgrade cluster dependencies (operators/ingress/cert-manager) to latest stable"
  hosts: kube_master
  gather_facts: false
  tags: [deps]
  vars:
    helm_deps:
      - {release: cert-manager, repo_url: https://charts.jetstack.io, chart: cert-manager/cert-manager, ns: cert-manager, deploy: cert-manager}
      - {release: ingress-nginx, repo_url: https://kubernetes.github.io/ingress-nginx, chart: ingress-nginx/ingress-nginx, ns: ingress-nginx, deploy: ingress-nginx-controller}
      - {release: cnpg, repo_url: https://cloudnative-pg.github.io/charts, chart: cnpg/cloudnative-pg, ns: postgres, deploy: cnpg-controller-manager}
      - {release: mongodb-community-operator, repo_url: https://mongodb.github.io/helm-charts, chart: mongodb/community-operator, ns: mongo, deploy: mongodb-kubernetes-operator}
      - {release: strimzi-operator, repo_url: https://strimzi.io/charts/, chart: strimzi/strimzi-kafka-operator, ns: kafka, deploy: strimzi-cluster-operator}
  tasks:
    - name: Ensure dependency helm repos are present
      ansible.builtin.command: "helm repo add {{ item.release }} {{ item.repo_url }}"
      loop: "{{ helm_deps }}"
      loop_control: { label: "{{ item.release }}" }
      changed_when: false

    - name: Update helm repos
      ansible.builtin.command: helm repo update
      changed_when: true

    - name: Resolve installed vs latest-stable per dependency
      ansible.builtin.shell: |
        CUR=$(helm list -n {{ item.ns }} --filter "^{{ item.release }}$" -o json | python3 -c "import sys,json;r=json.load(sys.stdin);print(r[0]['chart'].rsplit('-',1)[-1].lstrip('v') if r else '')")
        NEW=$(helm search repo {{ item.chart }} -l -o json | python3 -c "import sys,json;print(json.load(sys.stdin)[0]['version'])")
        echo "$CUR $NEW"
      loop: "{{ helm_deps if (only | default('')) == '' else (helm_deps | selectattr('release', 'equalto', only)) }}"
      loop_control: { label: "{{ item.release }}" }
      register: dep_versions
      changed_when: false

    - name: Report dependency paths
      ansible.builtin.debug:
        msg: "{{ item.item.release }}: {{ item.stdout.split()[0] }} -> {{ item.stdout.split()[1] }}"
      loop: "{{ dep_versions.results }}"
      loop_control: { label: "{{ item.item.release }}" }

    - name: Upgrade dependencies that lag behind (user values over new defaults)
      ansible.builtin.shell: |
        set -e
        helm get values {{ item.item.release }} -n {{ item.item.ns }} -o yaml > /tmp/dep-values.yaml
        case "$(grep -vE '^\s*(#|$)' /tmp/dep-values.yaml | tr -d ' \n')" in
          ""|null) echo "{}" > /tmp/dep-values.yaml ;;
        esac
        helm upgrade {{ item.item.release }} {{ item.item.chart }} -n {{ item.item.ns }} -f /tmp/dep-values.yaml >/dev/null
        kubectl -n {{ item.item.ns }} rollout status deployment/{{ item.item.deploy }} --timeout=120s | tail -1
      loop: "{{ dep_versions.results }}"
      loop_control: { label: "{{ item.item.release }}" }
      when: (item.stdout.split()[0] != item.stdout.split()[1])
      register: dep_upgrades

    - name: "Wait for managed CRs to reconcile (fully-qualified names: 'cluster' is ambiguous with CAPI)"
      ansible.builtin.shell: |
        kubectl -n kafka wait kafkas.kafka.strimzi.io/kafka-cluster --for=condition=Ready --timeout=240s | tail -1
        kubectl -n postgres wait clusters.postgresql.cnpg.io/postgres-app --for=condition=Ready --timeout=120s | tail -1
        kubectl -n postgres wait clusters.postgresql.cnpg.io/postgres-keycloak --for=condition=Ready --timeout=120s | tail -1
        kubectl -n mongo get mongodbcommunity.mongodb.com mongodb-rs -o jsonpath='{.status.phase}'
        echo
      changed_when: false
      when: dep_upgrades.results | selectattr('changed', 'defined') | selectattr('changed') | list | length > 0

    - name: Note Rancher-managed charts (upgraded by Rancher, not here)
      ansible.builtin.debug:
        msg: "fleet / rancher-turtles / fleet-crd are Rancher-managed feature charts — upgrade them via Rancher, this play skips them."

- name: Post-flight — versions and health
  hosts: kube_master
  gather_facts: false
  tags: [report, always]
  tasks:
    - name: Collect versions after
      ansible.builtin.shell: |
        echo "rancher=$(kubectl -n cattle-system get deploy rancher -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null)"
        echo "longhorn=$(kubectl -n longhorn-system get deploy longhorn-driver-deployer -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null)"
        echo "linkerd=$(kubectl -n linkerd get deploy linkerd-destination -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null)"
        echo "k3s=$(kubectl get nodes -o jsonpath='{.items[0].status.nodeInfo.kubeletVersion}' 2>/dev/null)"
      register: ver_after
      changed_when: false
      check_mode: false

    - name: App health after upgrades
      ansible.builtin.shell: |
        T=$(curl -s -m 8 -d "client_id=frontend" -d "username=user" -d "password=user" -d "grant_type=password" https://auth.softeno.dev/realms/app/protocol/openid-connect/token | python3 -c "import sys,json;print(json.load(sys.stdin).get('access_token',''))")
        echo "external: $(curl -s -m 8 -H "Authorization: Bearer $T" https://api.softeno.dev/spring-reactive-template/external/1) $(curl -s -m 8 -H "Authorization: Bearer $T" https://api.softeno.dev/spring-reactive-r2dbc-template/external/1)"
      register: app_health
      changed_when: false
      check_mode: false

    - name: Report
      ansible.builtin.debug:
        msg: "{{ ver_after.stdout_lines + [app_health.stdout] }}"
